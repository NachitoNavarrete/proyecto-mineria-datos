<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Minería de Datos - Semana 1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">Proyecto Minería de Datos</a>
        </div>
    </nav>

    <div class="container">
        <!-- Aquí se mostrarán los mensajes de éxito o error -->
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-info">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- El contenido de las otras páginas se inyecta aquí -->
        {% block content %}{% endblock %}
    </div>
</body>
</html>
