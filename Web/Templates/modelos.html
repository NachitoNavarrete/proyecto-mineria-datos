{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Modelos Guardados</h2>
    <a href="{{ url_for('index') }}" class="btn btn-secondary">Volver al Inicio</a>
</div>

<table class="table table-bordered table-striped">
    <thead class="table-dark">
        <tr>
            <th>Fecha</th>
            <th>Variable Objetivo</th>
            <th>Exactitud</th>
            <th>Filas Usadas</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for m in modelos %}
        <tr>
            <td>{{ m.fecha }}</td>
            <td>{{ m.variable_objetivo }}</td>
            <td>{{ m.exactitud }}%</td>
            <td>{{ m.filas_entrenadas }}</td>
            <td>
                <form action="{{ url_for('eliminar_modelo', modelo_id=m.id) }}" method="POST">
                    <button type="submit" class="btn btn-danger btn-sm">Eliminar</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
