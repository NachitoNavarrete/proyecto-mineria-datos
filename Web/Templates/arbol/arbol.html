<!-- 
  ============================================================
  CONFIGURACIÓN DEL ÁRBOL (arbol.html)
  ============================================================
  ¿Qué hace este archivo?
  Muestra un formulario para que el usuario elija qué predecir,
  qué datos usar y qué tan profundo será el árbol.
-->

{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h4 class="mb-0">Configurar Árbol de Decisión</h4>
            </div>
            <div class="card-body">
                
                <!-- El formulario envía los datos por POST a la ruta /entrenar_arbol -->
                <form action="{{ url_for('entrenar') }}" method="POST">
                    
                    <!-- 1. VARIABLE OBJETIVO -->
                    <div class="mb-4">
                        <label class="form-label fw-bold">1. Variable Objetivo (¿Qué quieres predecir?)</label>
                        <select name="variable_objetivo" class="form-select" required>
                            <option value="" disabled selected>Selecciona una columna...</option>
                            <!-- Recorremos la lista de columnas del CSV -->
                            {% for col in columnas %}
                                <option value="{{ col }}">{{ col }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- 2. VARIABLES PREDICTORAS -->
                    <div class="mb-4">
                        <label class="form-label fw-bold">2. Variables Predictoras (¿Qué datos usará para predecir?)</label>
                        <div class="border p-3 rounded bg-light" style="max-height: 200px; overflow-y: auto;">
                            {% for col in columnas %}
                            <div class="form-check">
                                <!-- El name="predictoras" es un array. El servidor los recibe todos juntos -->
                                <input class="form-check-input" type="checkbox" name="predictoras" value="{{ col }}" id="check_{{ loop.index }}">
                                <label class="form-check-label" for="check_{{ loop.index }}">{{ col }}</label>
                            </div>
                            {% endfor %}
                        </div>
                        <small class="text-muted">Marca las columnas que el modelo puede usar.</small>
                    </div>

                    <!-- 3. PARÁMETROS -->
                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Profundidad Máxima</label>
                            <input type="number" name="profundidad" class="form-control" value="3" min="1" max="20" required>
                            <small class="text-muted">A mayor profundidad, más complejo el árbol.</small>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Tamaño de Prueba (Test)</label>
                            <input type="number" name="test_size" class="form-control" value="0.2" step="0.1" min="0.1" max="0.5" required>
                            <small class="text-muted">Ej: 0.2 significa 20% para probar, 80% para entrenar.</small>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 btn-lg">Entrenar Árbol</button>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
