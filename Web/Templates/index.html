{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-body">
                <h3 class="card-title">Subir Archivo CSV</h3>
                <p class="text-muted">Validación de formato y vista previa (Semana 1).</p>
                
                <!-- enctype es OBLIGATORIO para enviar archivos -->
                <form action="{{ url_for('upload_file') }}" method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <input class="form-control" type="file" name="file" accept=".csv" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Cargar Archivo</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
